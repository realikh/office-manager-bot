name: ci

# Tests only. The bot itself does not run here — that is the whole point of the rebuild.
on:
  push:
  pull_request:
  # Started by holidays.yml after it pushes a calendar update: a push made with the
  # workflow token does not trigger this file on its own.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Architecture
        run: uv run lint-imports
      - name: Config
        run: uv run tabelshchik validate
      - name: Migrations match the models
        # Catches a model edited without a migration, which would otherwise only show up
        # as a crash against a real database. `check` compares the models against a
        # database at head, so an empty one has to be brought up first — on a fresh
        # checkout there is no database at all.
        env:
          TABELSHCHIK_DB: ${{ runner.temp }}/migration-check.db
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Tests
        run: uv run pytest -q

  deploy:
    # A red build never reaches the VM: `needs` makes this job wait for `check`, and a
    # failed `check` skips it entirely.
    needs: check
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      # Let an in-flight deploy finish rather than killing it mid-build and leaving the
      # VM holding a half-built image.
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Pinned from a secret rather than StrictHostKeyChecking=no, which would accept
          # whatever machine happens to answer on that address.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

          # The key is locked to a forced command, so this argument is ignored by the
          # server; it is here to make the intent readable in the Actions log.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o ConnectTimeout=15 \
              "$USER@$HOST" deploy
