[project]
name = "tabelshchik"
version = "0.1.0"
description = "Табельщик — office attendance management Telegram bot"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31,<4",
    "apscheduler>=3.11,<4",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyyaml>=6.0,<7",
    "holidays>=0.70,<1",
    "xlsxwriter>=3.2,<4",
    "httpx>=0.28,<1",
    "structlog>=24.4",
    "tzdata>=2024.2",
]

[project.scripts]
tabelshchik = "tabelshchik.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "hypothesis>=6.122,<7",
    "mypy>=1.14,<2",
    "ruff>=0.9,<1",
    "import-linter>=2.1,<3",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabelshchik"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ARG", "PTH", "TID"]
ignore = ["RUF001", "RUF002", "RUF003"]  # ambiguous unicode: we write Russian

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
mypy_path = ["scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["holidays.*", "xlsxwriter.*", "apscheduler.*"]
ignore_missing_imports = true

# Strict typing earns its keep in src, where the types are the design. In tests it mostly
# produces annotation noise on throwaway fixtures, so the checks that matter stay on and
# the ceremony comes off.
[[tool.mypy.overrides]]
module = ["tests.*", "migrate_from_old_bot"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
# Tests assert on values they have just written, so narrowing every Optional would be
# noise that hides real findings.
disable_error_code = ["union-attr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
markers = [
    "slow: long-run fairness simulations; skip locally with -m 'not slow'",
]

[tool.importlinter]
root_packages = ["tabelshchik"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture: domain <- application <- adapters <- bootstrap"
type = "layers"
layers = [
    "tabelshchik.bootstrap",
    "tabelshchik.adapters",
    "tabelshchik.application",
    "tabelshchik.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure: no I/O, no frameworks"
type = "forbidden"
source_modules = ["tabelshchik.domain"]
forbidden_modules = [
    "aiogram", "sqlalchemy", "httpx", "apscheduler", "xlsxwriter",
    "yaml", "asyncio", "pathlib", "os", "logging",
]
