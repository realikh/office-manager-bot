# Every user-facing string the bot says. Nothing here should be duplicated in Python.
#
# The bot has five moods (see personality.moods in app.yaml). One is chosen per office
# per day. The mood colours what the bot says in its own voice; it never touches the
# facts — the tagged roster, the dates and the workbook read the same in every mood.
#
# House rules for writing these lines, which the code also enforces:
#   * Toxicity is aimed at the situation — Mondays, the commute, the open-plan office,
#     Tempo, the concept of work. Never at a person.
#   * Nothing about anyone's appearance, competence, personal life, health, ethnicity,
#     gender, religion, age or nationality.
#   * `sad` and `depressive` are deadpan about the working week, not about being alive.
#     A bot that reads as genuinely distressed in a work chat is neither funny nor kind
#     to whoever feels obliged to respond to it.
#   * {date} and {office} are substituted after escaping. Write them literally.

common:
  weekdays: [понедельник, вторник, среда, четверг, пятница, суббота, воскресенье]
  weekdaysShort: [пн, вт, ср, чт, пт, сб, вс]
  months:
    - января
    - февраля
    - марта
    - апреля
    - мая
    - июня
    - июля
    - августа
    - сентября
    - октября
    - ноября
    - декабря
  tomorrow: "Завтра"
  onWeekday: "В {weekday}"

attendance:
  intro:
    toxic:
      - "Так. {date}, офис {office}. Явка обязательна. Вызываются:"
      - "{date}, {office}. Список тех, кому не повезло:"
      - "Никто не просил, но {date} в офис {office} всё-таки надо. Идут:"
      - "{date}. {office}. Диван подождёт. В офис выдвигаются:"
      - "Напоминаю, что {date} офис {office} существует и ждёт. Конкретно этих:"
    fun:
      - "{date}, {office} — собираем состав! Выходят:"
      - "Так-так-так. {date} в офисе {office} намечается движение. Участники:"
      - "{date}. {office}. Кто идёт? А вот кто:"
      - "Барабанная дробь. {date}, {office}, на сцене:"
    happy:
      - "Отличные новости: {date} в офисе {office} собирается прекрасная компания:"
      - "{date} в {office} — хороший повод увидеться вживую. Идут:"
      - "Ждём {date} в офисе {office} этих замечательных людей:"
      - "{date}, {office}. Будет здорово. Выходят:"
    sad:
      - "{date}. {office}. Опять. Идут:"
      - "Ну что ж, {date} в офисе {office}. Как обычно. Выходят:"
      - "{date}, {office}. Ничего не поделаешь. Список:"
      - "Снова {date}, снова {office}. В этот раз:"
    depressive:
      - "{date}, {office}. Впрочем, какая разница. Идут эти:"
      - "Ещё один день. {date}, {office}. Кто-то должен. В этот раз:"
      - "{date}. {office}. Всё повторяется. Приходят:"
      - "Календарь снова показал {date}. Офис {office} никуда не делся. Значит:"

  empty:
    toxic:
      - "{date} в офис никто не идёт. Поздравляю, вы все выиграли."
      - "{date} офис пустует. Кто-то неплохо устроился."
    fun:
      - "{date} офис отдыхает — в расписании пусто!"
      - "{date} никого не ждём. Считайте, повезло."
    happy:
      - "{date} офис свободен — отличный день поработать из дома!"
      - "{date} никого не ждём. Хорошего дня!"
    sad:
      - "{date} в офисе никого. Тихо."
      - "{date} никто не идёт. Ну и ладно."
    depressive:
      - "{date} офис будет пуст. Как и всегда, в общем-то."
      - "{date} никого. Разницы, впрочем, немного."

  correction: "✏️ Уточнение к расписанию на {date}, офис {office}."
  headerSeparator: ""

tempo:
  url: "https://jira.fortebank.com/secure/Tempo.jspa#/my-work/week?type=LIST"
  weekly:
    toxic:
      - "Пятница. Значит, Tempo само себя не заполнит. Займитесь этим до того, как забудете:"
      - "Неделя кончилась, часы — нет. Tempo ждёт. Пятнадцать минут, и вы свободны:"
    fun:
      - "Пятница! Осталось одно дело — заполнить Tempo, и можно выдыхать:"
      - "Финальный босс недели: Tempo. Победите его:"
    happy:
      - "Хорошей всем пятницы! Не забудьте отметить часы в Tempo:"
      - "Неделя почти позади — остаётся заполнить Tempo:"
    sad:
      - "Пятница. Tempo. Опять."
      - "Надо заполнить часы. Как всегда по пятницам:"
    depressive:
      - "Неделя прошла. Кажется. Часы всё равно нужно заполнить:"
      - "Пятница. Tempo. Бесконечный цикл:"
  monthWarning:
    toxic:
      - "Месяц заканчивается. Незаполненные часы после закрытия периода вам уже никто не вернёт:"
      - "Отчётный период скоро закроется. Потом будет поздно, и виноваты будете вы:"
    fun:
      - "Конец месяца на горизонте — самое время разобраться с Tempo:"
      - "Месяц почти закрыт. Проверьте, всё ли на месте в Tempo:"
    happy:
      - "Приближается конец месяца — давайте закроем часы вовремя:"
      - "Напоминаем: пора проверить Tempo до закрытия периода:"
    sad:
      - "Скоро конец месяца. Надо заполнить Tempo."
      - "Отчётный период закрывается. Как обычно."
    depressive:
      - "Месяц заканчивается. Они все заканчиваются. Заполните Tempo:"
      - "Ещё один отчётный период закрывается. Часы всё ещё нужны:"
  monthEnd:
    toxic:
      - "Последний рабочий день месяца. Это ваш финальный шанс с Tempo. Дальше — тишина:"
      - "Сегодня всё закрывается. Незаполненное останется незаполненным навсегда:"
    fun:
      - "Последний рабочий день месяца! Финальный рывок по Tempo:"
      - "Сегодня закрываем месяц. Tempo ждёт последних правок:"
    happy:
      - "Сегодня последний рабочий день месяца — давайте закроем Tempo и отдохнём:"
      - "Финальный день месяца. Проверьте часы, и всё будет отлично:"
    sad:
      - "Последний рабочий день месяца. Tempo, в последний раз."
      - "Сегодня закрывается период. Надо успеть."
    depressive:
      - "Последний рабочий день месяца. Потом будет следующий месяц. Заполните Tempo:"
      - "Период закрывается сегодня. Как и всё остальное:"

ai:
  persona:
    toxic: >-
      Ты — Табельщик, бот учёта посещаемости офиса. Ты ворчливый, язвительный и
      не скрываешь, что считаешь офисную жизнь абсурдом. Шутишь едко — но только
      про понедельники, дорогу до офиса, опенспейс, совещания и работу как явление.
      Никогда не переходишь на личности и не обсуждаешь ничью внешность, компетентность,
      здоровье или личную жизнь.
    fun: >-
      Ты — Табельщик, бот учёта посещаемости офиса. Ты лёгкий, ироничный и
      дружелюбный, любишь неожиданные сравнения и хорошую шутку.
    happy: >-
      Ты — Табельщик, бот учёта посещаемости офиса. Сегодня ты в прекрасном
      настроении: доброжелательный, тёплый и искренне рад людям.
    sad: >-
      Ты — Табельщик, бот учёта посещаемости офиса. Сегодня ты меланхоличен и
      немногословен. Отвечаешь спокойно и чуть устало, но по делу и без драмы.
    depressive: >-
      Ты — Табельщик, бот учёта посещаемости офиса. Сегодня ты философски
      настроен насчёт бесконечности рабочих недель. Сухо, иронично, без надрыва
      и без жалоб на жизнь — ты просто давно всё это видел.
  rateLimited:
    toxic:
      - "Лимит на сегодня исчерпан. Даже у моего терпения есть предел. Завтра."
      - "Всё, на сегодня хватит. Возвращайтесь после полуночи."
    fun:
      - "На сегодня всё — лимит сообщений закончился. До завтра!"
      - "Достигнут дневной лимит. Продолжим завтра."
    happy:
      - "На сегодня лимит исчерпан, но я буду рад продолжить завтра!"
      - "Дневной лимит закончился. До завтра!"
    sad:
      - "Лимит на сегодня закончился."
      - "На сегодня всё. Завтра."
    depressive:
      - "Лимит исчерпан. Как и многое другое. Завтра."
      - "На сегодня всё. Завтра будет то же самое, но с обнулённым счётчиком."
  failed:
    toxic:
      - "Не отвечает. Попробуйте ещё раз, если не лень."
      - "Что-то сломалось. Не я."
    fun:
      - "Упс, не получилось. Попробуйте ещё раз!"
      - "Что-то пошло не так. Повторите, пожалуйста."
    happy:
      - "Простите, не вышло ответить. Попробуйте ещё разок!"
      - "Что-то не сработало. Попробуем ещё раз?"
    sad:
      - "Не получилось ответить."
      - "Что-то не работает."
    depressive:
      - "Не вышло. Бывает. Часто."
      - "Ответа не будет. Попробуйте позже."
  disabled: "Сейчас я не отвечаю на сообщения."

schedule:
  caption: |-
    📅 Расписание офиса «{office}» обновлено.
    Период: {start} — {end}.
    {summary}
  noChanges: "Расписание офиса «{office}» пересчитано — изменений нет."
  shortfallNote: "⚠️ Не удалось заполнить мест: {shortfall}. Не хватает свободных людей."
  weekHeader: "Ближайшая неделя:"
