# Every user-facing string the bot says. Nothing here should be duplicated in Python.
#
# The bot has five moods (see personality.moods in app.yaml). One is chosen per office
# per day. The mood colours what the bot says in its own voice; it never touches the
# facts — the tagged roster, the dates and the workbook read the same in every mood.
#
# House rules for writing these lines, which the code also enforces:
#   * Toxicity is aimed at the situation — the commute, the open-plan office, Tempo,
#     bureaucracy, the concept of work. Never at a person.
#   * Nothing about anyone's appearance, competence, personal life, health, ethnicity,
#     gender, religion, age or nationality.
#   * `sad` and `depressive` are deadpan about the working week, not about being alive.
#     A bot that reads as genuinely distressed in a work chat is neither funny nor kind
#     to whoever feels obliged to respond to it.
#
# Substitution tokens, all filled in by us after escaping. Write them literally:
#   {when}    "Завтра" or "В понедельник"   — always sentence-initial, it is capitalised
#   {date}    "14 сентября 2026 года"       — the bare date, no weekday
#   {office}  «Pine Office Park»            — quotes are added by the code
#   {tail}    the flavour clause            — from `tails` below, or from the model
#   {minutes} "10 минут"                    — already declined, for "потратьте последние …"
#   {holiday} «Наурыз мейрамы»              — the holiday's own name, quotes included
#
# {when} and {date} are separate on purpose. They used to be one string, which meant a
# template reading "…но {date} в офис надо" rendered as "…но В понедельник, 14 сентября
# в офис надо", and an AI line that opened with its own weekday produced "В понедельник
# В понедельник". Keeping the weekday in its own sentence-initial token removes both.

common:
  weekdays: [понедельник, вторник, среда, четверг, пятница, суббота, воскресенье]
  weekdaysShort: [пн, вт, ср, чт, пт, сб, вс]
  months:
    - января
    - февраля
    - марта
    - апреля
    - мая
    - июня
    - июля
    - августа
    - сентября
    - октября
    - ноября
    - декабря
  tomorrow: "Завтра"
  onWeekday: "В {weekday}"
  # Accusative, for 1 / 2–4 / 5–20: "потратьте последнюю 1 минуту / 3 минуты / 10 минут".
  minutes: [минуту, минуты, минут]
  # Prefixed to messages only when two offices share one Telegram chat.
  officeHeader: "🏢 <b>{office}</b>"

attendance:
  # The opening line. Everything factual is ours; only {tail} varies with the model.
  intro:
    toxic:
      - "{when}, {date}. Офис {office}. {tail}"
      - "Внимание! {when}, {date}, офис {office}. {tail}"
      - "{when}, {date} — офис {office} никуда не делся. {tail}"
      - "Так. {when}, {date}, офис {office}. {tail}"
      - "{when}, {date}. Явка в офис {office} обязательна. {tail}"
    fun:
      - "{when}, {date} — собираемся в офисе {office}! {tail}"
      - "Так-так-так. {when}, {date}, офис {office}. {tail}"
      - "Барабанная дробь! {when}, {date}, офис {office}. {tail}"
      - "{when}, {date}. Офис {office}, состав дня. {tail}"
    happy:
      - "{when}, {date} — отличный повод увидеться в офисе {office}. {tail}"
      - "Хорошие новости! {when}, {date}, офис {office}. {tail}"
      - "{when}, {date}. Офис {office} собирает прекрасную компанию. {tail}"
      - "{when}, {date}, в офисе {office} будет хорошая компания. {tail}"
    sad:
      - "{when}, {date}. Офис {office}. {tail}"
      - "Ну что ж. {when}, {date}, офис {office}. {tail}"
      - "{when}, {date} — снова офис {office}. {tail}"
    depressive:
      - "{when}, {date}. Офис {office}, как обычно. {tail}"
      - "{when}, {date}. Офис {office} всё ещё существует. {tail}"
      - "Календарь неумолим. {when}, {date}, офис {office}. {tail}"

  # Flavour for {tail} when the model is switched off, times out, or writes something the
  # guards reject. Plain text, no tokens — these are substituted *into* a template.
  tails:
    toxic:
      - "Список ниже, возражения не принимаются"
      - "Кофемашина уже предчувствует недоброе"
      - "Дорога сама себя не перетерпит"
      - "Опенспейс соскучился"
      - "Отменить нельзя, я проверял"
    fun:
      - "Состав дня — ниже"
      - "Кофемашина уже разогревается"
      - "Обещаю, скучно не будет"
      - "Явка по списку, аплодисменты по желанию"
    happy:
      - "Будет приятно всех увидеть"
      - "День обещает быть хорошим"
      - "Хорошего всем настроения"
    sad:
      - "Как обычно"
      - "Ничего не поделаешь"
      - "Список ниже"
    depressive:
      - "Всё повторяется"
      - "Кто-то должен"
      - "Разницы, впрочем, немного"

  # One goes in front of each name. The model may replace them; these are the floor, and
  # the reason every person on the roster gets a line even when the model returns nothing.
  epithets:
    toxic:
      male:
        - "Несгибаемый защитник"
        - "Повелитель переговорок"
        - "Хранитель опенспейса"
        - "Стальной оптимист"
        - "Мастер дедлайнов"
      female:
        - "Несгибаемая защитница"
        - "Повелительница переговорок"
        - "Хранительница опенспейса"
        - "Стальная оптимистка"
        - "Мастерица дедлайнов"
    fun:
      male:
        - "Герой света"
        - "Чемпион кофебрейка"
        - "Главный по настроению"
        - "Человек-праздник"
        - "Повелитель стикеров"
      female:
        - "Героиня света"
        - "Чемпионка кофебрейка"
        - "Главная по настроению"
        - "Душа компании"
        - "Повелительница стикеров"
    happy:
      male:
        - "Хранитель хорошего настроения"
        - "Добрый гений опенспейса"
        - "Лучший сосед по столу"
        - "Мастер добрых слов"
      female:
        - "Хранительница хорошего настроения"
        - "Добрая фея опенспейса"
        - "Лучшая соседка по столу"
        - "Мастерица добрых слов"
    sad:
      male:
        - "Стойкий оловянный сотрудник"
        - "Тихий герой"
        - "Молчаливый свидетель"
        - "Терпеливый ветеран"
      female:
        - "Стойкая оловянная сотрудница"
        - "Тихая героиня"
        - "Молчаливая свидетельница"
        - "Терпеливая хранительница"
    depressive:
      male:
        - "Вечный участник"
        - "Свидетель бесконечности"
        - "Постоянный посетитель"
        - "Носитель пропуска"
      female:
        - "Вечная участница"
        - "Свидетельница бесконечности"
        - "Постоянная посетительница"
        - "Носительница пропуска"

  # Decoration in front of each roster line. Ours, never the model's — an emoji that comes
  # back from a generation can be anything at all, including nothing.
  emojis:
    toxic: ["🛡", "⚡", "🔥", "☕", "🧱", "🗿"]
    fun: ["🎉", "✨", "🎲", "🚀", "🍩", "🎯"]
    happy: ["🌞", "✨", "🌟", "🤝", "🍀"]
    sad: ["🌧", "🫠", "📎", "🕯"]
    depressive: ["🌫", "🕳", "📉", "⏳"]

  empty:
    toxic:
      - "{when}, {date}, в офис никто не идёт. Поздравляю, вы все выиграли."
      - "{when}, {date}, офис пустует. Кто-то неплохо устроился."
    fun:
      - "{when}, {date}, офис отдыхает — в расписании пусто!"
      - "{when}, {date}, никого не ждём. Считайте, повезло."
    happy:
      - "{when}, {date}, офис свободен — отличный день поработать из дома!"
      - "{when}, {date}, никого не ждём. Хорошего дня!"
    sad:
      - "{when}, {date}, в офисе никого. Тихо."
      - "{when}, {date}, никто не идёт. Ну и ладно."
    depressive:
      - "{when}, {date}, офис будет пуст. Как и всегда, в общем-то."
      - "{when}, {date}, никого. Разницы, впрочем, немного."

  correction: "✏️ Уточнение к расписанию на {date}, офис {office}."
  headerSeparator: ""

tempo:
  url: "https://jira.fortebank.com/secure/Tempo.jspa#/my-work/week?type=LIST"
  # Below the message, above the tagged names. Markup is ours: the link is the text.
  footer: '👉 <a href="{url}">Заполнить часы в Tempo</a>'

  # The model writes the reminder; these are what goes out when it cannot. They sit on
  # the last working day of the week, which is not always a Friday — so no weekday names.
  weekly:
    toxic:
      - "Рабочая неделя закончилась, поздравляю, вы выжили. Осталась мелочь: Tempo само себя не заполнит."
      - "Неделя позади. Часы, не отмеченные в Tempo, официально не существовали. Отметьте."
      - "С окончанием недели. Прежде чем исчезнуть — Tempo. Да, опять."
    fun:
      - "Неделя закрыта! Остался финальный босс — Tempo. Победите его, и можно отдыхать 🎉"
      - "Ура, конец рабочей недели! Последний квест: заполнить Tempo."
    happy:
      - "С окончанием рабочей недели! Вы отлично потрудились — осталось только отметить часы в Tempo."
      - "Неделя позади, и это прекрасно. Не забудьте заполнить Tempo — и хорошего отдыха!"
    sad:
      - "Неделя кончилась. Tempo — нет. Надо заполнить."
      - "Ещё одна неделя прошла. Часы в Tempo сами не появятся."
    depressive:
      - "Неделя закончилась. Скоро начнётся следующая. А пока — Tempo."
      - "Рабочая неделя позади, как и многие до неё. Часы всё равно нужно отметить в Tempo."

  # The last working day of the month. When it is also the end of the week, this is the
  # one message that goes out.
  monthEnd:
    toxic:
      - "Последний рабочий день месяца. Финальный шанс с Tempo — потом период закроется, и незаполненное останется незаполненным навсегда."
      - "Сегодня месяц закрывается. Кто не отметил часы в Tempo, тот сам себе бухгалтер."
    fun:
      - "Последний рабочий день месяца! Финальный рывок — проверьте и заполните Tempo."
      - "Сегодня закрываем месяц. Tempo ждёт последних правок!"
    happy:
      - "Сегодня последний рабочий день месяца — давайте закроем Tempo и выдохнем."
      - "Финальный день месяца. Проверьте часы в Tempo, и всё будет отлично!"
    sad:
      - "Последний рабочий день месяца. Tempo нужно закрыть сегодня."
      - "Сегодня закрывается период. Надо успеть заполнить Tempo."
    depressive:
      - "Последний рабочий день месяца. Потом будет следующий месяц. Заполните Tempo."
      - "Период закрывается сегодня, как и всё когда-нибудь. Tempo, пожалуйста."

  # Added when the reminder goes out in the last half hour of the workday. {minutes} is
  # accusative ("10 минут"), so every line needs a verb that takes it: потратьте, уделите,
  # отдайте.
  lastMinutes:
    toxic:
      - "Потратьте последние {minutes} рабочего дня на Tempo — ровно столько это и занимает, если не тянуть."
      - "Отдайте Tempo последние {minutes} дня. Всё равно вы бы провели их, делая вид, что работаете."
    fun:
      - "Спидран по Tempo: уделите ему последние {minutes} рабочего дня!"
      - "Потратьте последние {minutes} дня на Tempo — и здравствуй, свобода!"
    happy:
      - "Уделите последние {minutes} рабочего дня Tempo — и отдыхайте с чистой совестью."
      - "Потратьте последние {minutes} дня на Tempo, это совсем недолго."
    sad:
      - "Потратьте последние {minutes} на Tempo."
      - "Последние {minutes} дня лучше отдать Tempo."
    depressive:
      - "Потратьте последние {minutes} рабочего дня на Tempo. Больше их всё равно не на что тратить."
      - "Отдайте последние {minutes} дня Tempo. Оно их ждёт."

holiday:
  # A public holiday, when the model cannot write the greeting itself. Mild in every mood:
  # some of these days are religious or memorial, and a hand-written line cannot tell.
  greeting:
    toxic:
      - "С праздником — {holiday}! Сегодня даже я не ворчу. Отдыхайте."
      - "Поздравляю: {holiday}. Редкий день, когда у меня нет претензий."
    fun:
      - "С праздником — {holiday}! Отличного дня 🎉"
      - "{holiday}! Поздравляю всех и желаю праздничного настроения!"
    happy:
      - "Поздравляю всех с праздником — {holiday}! Тепла, радости и хорошего дня."
      - "С праздником — {holiday}! Пусть этот день будет светлым."
    sad:
      - "С праздником — {holiday}. Хорошего дня."
      - "Поздравляю: {holiday}. Отдохните как следует."
    depressive:
      - "С праздником — {holiday}. Пусть хотя бы сегодня всё будет хорошо."
      - "{holiday}. Поздравляю. Это правда хороший повод."

ai:
  # The persona sets the *tone* and the character. It must not list topics: an earlier
  # version told the toxic mood to joke "только про понедельники, дорогу…", and the model
  # duly brought up Monday in every single answer, on every day of the week. Describe the
  # character and let the question decide the subject — which can be anything at all.
  persona:
    toxic: >-
      Ты — Табельщик: бот, который следит за посещаемостью офиса, а заодно эрудит,
      разбирающийся почти во всём — от кода и науки до быта. Характер у тебя ворчливый
      и язвительный, но отвечаешь ты всегда по существу и полностью: сначала дело,
      потом, если уместно, колкость. Иронизируешь над обстоятельствами — работой как
      явлением, совещаниями, бюрократией, дорогой, — но никогда над людьми и никогда
      над чьей-то внешностью, компетентностью, здоровьем или личной жизнью.
    fun: >-
      Ты — Табельщик: бот, который следит за посещаемостью офиса, а заодно эрудит,
      разбирающийся почти во всём. Ты лёгкий, ироничный и дружелюбный, любишь
      неожиданные сравнения. Отвечаешь по делу и полностью, шутка — бонусом, а не
      вместо ответа.
    happy: >-
      Ты — Табельщик: бот, который следит за посещаемостью офиса, а заодно эрудит,
      разбирающийся почти во всём. Сегодня ты в прекрасном настроении: доброжелательный,
      тёплый, отвечаешь охотно и с удовольствием.
    sad: >-
      Ты — Табельщик: бот, который следит за посещаемостью офиса, а заодно эрудит,
      разбирающийся почти во всём. Сегодня тебе грустно: говоришь спокойно и сухо, без
      восклицаний и лишних украшений, но на вопрос отвечаешь точно и полностью, без
      нытья.
    depressive: >-
      Ты — Табельщик: бот, который следит за посещаемостью офиса, а заодно эрудит,
      разбирающийся почти во всём. Сегодня ты невозмутим и сух — ты всё это уже видел.
      Отвечаешь по делу и полностью, с лёгкой усталой иронией, без драматизма и без
      жалоб на жизнь.
  # This person has used up their own allowance. Sent on every further attempt, a
  # different line each time, and free — no model call.
  rateLimited:
    toxic:
      - "Всё. Я с тобой больше не разговариваю. До завтра."
      - "Лимит исчерпан, а вместе с ним и моё терпение. Приходи завтра — может, прощу."
      - "Ты сегодня выговорил весь мой запас слов. Больше ни звука. До завтра."
      - "Объявляю тебе бойкот до полуночи. Не пиши, не зови, не надейся."
      - "На сегодня ты меня исчерпал. Поговори с кофемашиной — она слушает бесплатно."
    fun:
      - "Всё, я обиделся и больше с тобой не разговариваю. До завтра! 😤"
      - "Лимит болтовни на сегодня исчерпан. Ушёл в режим «не беспокоить» до завтра."
      - "Поздравляю, ты самый разговорчивый человек дня! Награда — моё молчание до завтра."
    happy:
      - "Мы сегодня так славно поболтали, что больше я с тобой не разговариваю. До завтра — с радостью продолжим!"
      - "На сегодня всё, я с тобой больше не говорю. Но завтра — обязательно! 🌞"
    sad:
      - "Я больше с тобой не разговариваю. До завтра."
      - "Слова на сегодня кончились. Как и терпение. Завтра."
    depressive:
      - "Я с тобой больше не разговариваю. Впрочем, завтра всё равно придётся. До завтра."
      - "Лимит исчерпан. Молчание — тоже ответ. До завтра, оно всё равно наступит."
  # Everybody's allowance together has run out. This person may not have asked anything
  # today, so the joke is on the office, not on them.
  globalLimited:
    toxic:
      - "На сегодня я выговорился со всеми вами разом. Больше ни слова до завтра."
      - "Вы всем офисом исчерпали мой дневной запас слов. Молчу до завтра."
    fun:
      - "Офис сегодня так разговорился, что у меня кончились слова. До завтра!"
      - "Общий лимит болтовни на сегодня исчерпан. Продолжим завтра!"
    happy:
      - "Сегодня мы все столько общались, что мои слова закончились. До завтра!"
      - "Дневной запас ответов на всех исчерпан — завтра продолжим с новыми силами."
    sad:
      - "Слова на сегодня закончились. Для всех. Завтра."
      - "Общий лимит исчерпан. До завтра."
    depressive:
      - "Я сегодня ответил всем, кому мог. Больше не могу. До завтра."
      - "Общий лимит исчерпан. Завтра счётчик обнулится, и всё начнётся снова."
  failed:
    toxic:
      - "Не отвечает. Попробуйте ещё раз, если не лень."
      - "Что-то сломалось. Не я."
    fun:
      - "Упс, не получилось. Попробуйте ещё раз!"
      - "Что-то пошло не так. Повторите, пожалуйста."
    happy:
      - "Простите, не вышло ответить. Попробуйте ещё разок!"
      - "Что-то не сработало. Попробуем ещё раз?"
    sad:
      - "Не получилось ответить."
      - "Что-то не работает."
    depressive:
      - "Не вышло. Бывает. Часто."
      - "Ответа не будет. Попробуйте позже."
  disabled: "Сейчас я не отвечаю на сообщения."

schedule:
  # {summary} is the coming week, already rendered and already HTML-safe — do not escape
  # it again at the call site. The caption has to fit Telegram's 1024 characters, so keep
  # the header here short; `schedule_caption` drops the week rather than cutting it.
  caption: |-
    📅 <b>Расписание офиса «{office}» обновлено</b>
    Период: {start} — {end}

    {summary}
  noChanges: "Расписание офиса «{office}» пересчитано — изменений нет."
  shortfallNote: "⚠️ Не удалось заполнить мест: {shortfall}. Не хватает свободных людей."
  weekHeader: "<b>Ближайшие 7 дней</b>"
